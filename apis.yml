aid: ohmium
name: Ohmium
description: 'Ohmium International designs, manufactures and deploys modular, vertically-stackable
  proton exchange membrane (PEM) electrolyzer systems for cost-competitive green hydrogen
  production. Its Lotus PEM electrolyzer platform integrates power electronics, water treatment
  and controls into skid-mounted modules for industrial, energy and mobility customers, and is
  paired with EPC and remote monitoring and maintenance (RM&M) services. Ohmium is a hardware
  and clean-energy engineering company: it publishes no public developer program, no API
  reference and no machine-readable specification, and its customer-facing monitoring and
  service portals are third-party SaaS products hosted on Ohmium subdomains behind login.'
